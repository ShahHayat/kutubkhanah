name: "kutubkhanah"
services:
    catalog-service:
        image: shahhayat/backend-catalog-service
        container_name: catalog-service
        environment:
            - SPRING_PROFILES_ACTIVE=docker
            - DB_URL=jdbc:postgresql://catalog-db:5432/kutubkhanah
            - DB_USERNAME=postgres
            - DB_PASSWORD=postgres
            - MANAGEMENT_TRACING_EXPORT_ENABLED=${MANAGEMENT_TRACING_EXPORT_ENABLED:-true}
        ports:
            - "8081:8081"
        restart: unless-stopped
        depends_on:
            catalog-db:
                condition: service_healthy
        deploy:
            resources:
                limits:
                    memory: 700m
        labels:
            logging: "promtail"

    order-service:
        image: shahhayat/backend-order-service
        container_name: order-service
        environment:
            - SPRING_PROFILES_ACTIVE=docker
            - ORDERS_CATALOG_SERVICE_URL=http://api-gateway:8989/catalog
            - DB_URL=jdbc:postgresql://orders-db:5432/kutubkhanah
            - DB_USERNAME=postgres
            - DB_PASSWORD=postgres
            - RABBITMQ_HOST=rabbitmq
            - RABBITMQ_PORT=5672
            - RABBITMQ_USERNAME=guest
            - RABBITMQ_PASSWORD=guest
            - OAUTH2_SERVER_URL=http://keycloak:9191
            - SWAGGER_API_GATEWAY_URL=http://api-gateway:8989/order
            - MANAGEMENT_TRACING_EXPORT_ENABLED=${MANAGEMENT_TRACING_EXPORT_ENABLED:-true}
            - MANAGEMENT_ZIPKIN_TRACING_ENDPOINT=http://tempo:9411
        ports:
            - "8082:8082"
        restart: unless-stopped
        depends_on:
            orders-db:
                condition: service_healthy
            rabbitmq:
                condition: service_healthy
        deploy:
            resources:
                limits:
                    memory: 700m
        labels:
            logging: "promtail"

    notification-service:
        image: shahhayat/backend-notification-service
        container_name: notification-service
        environment:
            - SPRING_PROFILES_ACTIVE=docker
            - DB_URL=jdbc:postgresql://notifications-db:5432/kutubkhanah
            - DB_USERNAME=postgres
            - DB_PASSWORD=postgres
            - RABBITMQ_HOST=rabbitmq
            - RABBITMQ_PORT=5672
            - RABBITMQ_USERNAME=guest
            - RABBITMQ_PASSWORD=guest
            - MAIL_HOST=mailhog
            - MAIL_PORT=1025
        ports:
            - "8083:8083"
        restart: unless-stopped
        depends_on:
            notifications-db:
                condition: service_healthy
            rabbitmq:
                condition: service_healthy
            mailhog:
                condition: service_started
        deploy:
            resources:
                limits:
                    memory: 700m
        labels:
            logging: "promtail"

    api-gateway:
        image: shahhayat/api-gateway
        container_name: api-gateway
        environment:
            - SPRING_PROFILES_ACTIVE=docker
            - CATALOG_SERVICE_URL=http://catalog-service:8081
            - ORDER_SERVICE_URL=http://order-service:8082
            - MANAGEMENT_TRACING_EXPORT_ENABLED=${MANAGEMENT_TRACING_EXPORT_ENABLED:-true}
            - MANAGEMENT_ZIPKIN_TRACING_ENDPOINT=http://tempo:9411
        ports:
            - "8989:8989"
        restart: unless-stopped
        deploy:
            resources:
                limits:
                    memory: 700m
        labels:
            logging: "promtail"

    kutubkhanah-webapp:
        image: shahhayat/kutubkhanah-webapp
        container_name: kutubkhanah-webapp
        environment:
            - SPRING_PROFILES_ACTIVE=docker
            - KUTUBKHANAH_API_GATEWAY_URL=http://api-gateway:8989
            - OAUTH2_SERVER_URL=http://keycloak:9191
            - MANAGEMENT_TRACING_EXPORT_ENABLED=${MANAGEMENT_TRACING_EXPORT_ENABLED:-true}
            - MANAGEMENT_ZIPKIN_TRACING_ENDPOINT=http://tempo:9411
        ports:
            - "8080:8080"
        restart: unless-stopped
        depends_on:
            api-gateway:
                condition: service_started
        deploy:
            resources:
                limits:
                    memory: 700m
        labels:
            logging: "promtail"
