name: "kutubkhanah"
services:
  catalog-db:
    image: postgres:18.1
    container_name: catalog-db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=kutubkhanah
    ports:
      - "15432:5432"
    volumes:
      - catalog-db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 500m

volumes:
  catalog-db-data:
