spring.application.name=kutubkhanah-webapp
server.port=8080
server.shutdown=graceful
spring.mvc.problemdetails.enabled=true

################## Kutub Khanah Application Configuration ##################
kutubkhanah.api-gateway-url=http://localhost:8989

###################### Actuator Configuration ######################
management.info.git.mode=full
management.endpoints.web.exposure.include=*
management.metrics.tags.application=${spring.application.name}
management.tracing.export.enabled=false
management.tracing.sampling.probability=1.0

###################### OAuth2 Security Configuration ######################
OAUTH2_SERVER_URL=http://localhost:9191
REALM_URL=${OAUTH2_SERVER_URL}/realms/kutubkhanah

spring.security.oauth2.client.registration.kutubkhanah-webapp.client-id=kutubkhanah-webapp
spring.security.oauth2.client.registration.kutubkhanah-webapp.client-secret=${OAUTH2_CLIENT_SECRET:P1sibsIrELBhmvK18BOzw1bUl96DcP2z}
spring.security.oauth2.client.registration.kutubkhanah-webapp.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.kutubkhanah-webapp.scope=openid, profile, email
spring.security.oauth2.client.registration.kutubkhanah-webapp.redirect-uri={baseUrl}/login/oauth2/code/kutubkhanah-webapp

# The endpoints are listed one by one instead of a single issuer-uri on purpose:
# with issuer-uri, Spring contacts Keycloak at startup and the app cannot start until Keycloak is running.
# Once Keycloak is set up you may replace the five lines below with:
spring.security.oauth2.client.provider.kutubkhanah-webapp.issuer-uri=${REALM_URL}
#spring.security.oauth2.client.provider.kutubkhanah-webapp.authorization-uri=${REALM_URL}/protocol/openid-connect/auth
#spring.security.oauth2.client.provider.kutubkhanah-webapp.token-uri=${REALM_URL}/protocol/openid-connect/token
#spring.security.oauth2.client.provider.kutubkhanah-webapp.jwk-set-uri=${REALM_URL}/protocol/openid-connect/certs
#spring.security.oauth2.client.provider.kutubkhanah-webapp.user-info-uri=${REALM_URL}/protocol/openid-connect/userinfo
