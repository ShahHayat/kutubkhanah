<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title>Your orders</title>
</head>
<body>
<div layout:fragment="content" x-data="orders(KK_PAGE)">
    <div class="kk-container kk-orders">

        <div class="kk-banner kk-in" role="status" x-show="banner" x-cloak>
            <span class="kk-banner__mark" aria-hidden="true">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
            </span>
            <div class="kk-banner__body">
                <div class="kk-banner__title">Order placed — <em class="kk-em">shukriya.</em></div>
                <div class="kk-banner__sub">A confirmation is on its way<span x-show="userEmail" x-text="' to ' + userEmail"></span>. You’ll hear from us again as soon as it moves.</div>
            </div>
            <button class="kk-ghost kk-ghost--sm kk-ghost--quiet" type="button" x-on:click="banner = false" aria-label="Dismiss message" style="width:44px; padding:0">
                <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M6 6l12 12"/><path d="M18 6L6 18"/></svg>
            </button>
        </div>

        <div class="kk-orders__head">
            <h1 class="kk-display kk-display--l">Your <em class="kk-em">orders</em></h1>
            <div class="kk-eyebrow" style="letter-spacing:.26em" x-text="loading ? '' : countLabel + ' · newest first'"></div>
        </div>

        <div class="kk-alert" x-show="error" x-cloak role="alert" style="margin-top:32px">
            <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#EA8A6E" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7.5v5.5"/><path d="M12 16.5v.01"/></svg>
            <span x-text="error"></span>
        </div>

        <div class="kk-empty" x-show="!loading && !error && orders.length === 0" x-cloak>
            <div class="kk-empty__mark" aria-hidden="true"></div>
            <div class="kk-empty__title">No orders yet.</div>
            <p>When you place one, you can follow it here from New to Delivered.</p>
            <a class="kk-btn" href="/products">Browse the catalog</a>
        </div>

        <div class="kk-orders__layout" x-show="loading || orders.length > 0">
            <nav class="kk-orders__list" aria-label="Orders">
                <template x-if="loading">
                    <div style="display:flex; flex-direction:column; gap:12px">
                        <div class="kk-skel" style="height:112px"></div>
                        <div class="kk-skel" style="height:112px"></div>
                    </div>
                </template>
                <template x-for="o in orders" x-bind:key="o.orderNumber">
                    <button class="kk-order-row" type="button" x-on:click="select(o.orderNumber)" x-bind:aria-current="o.orderNumber === selected ? 'true' : 'false'">
                        <div class="kk-order-row__top">
                            <span class="kk-order-row__num" x-text="'#' + short(o.orderNumber)"></span>
                            <span class="kk-status" x-bind:class="statusClass(o.status)"><i aria-hidden="true"></i><span x-text="statusLabel(o.status)"></span></span>
                        </div>
                        <div class="kk-order-row__bottom">
                            <div class="kk-thumbs" aria-hidden="true">
                                <template x-for="t in thumbs(o.orderNumber)" x-bind:key="t.code"><div x-html="cover(t)"></div></template>
                            </div>
                            <div class="kk-order-row__text">
                                <span x-text="summary(o.orderNumber) || o.orderNumber"></span>
                                <span x-text="details[o.orderNumber] ? date(details[o.orderNumber].createdAt) : 'Loading…'"></span>
                            </div>
                            <span class="kk-price" x-text="total(o.orderNumber)"></span>
                        </div>
                    </button>
                </template>
            </nav>

            <article class="kk-order" aria-labelledby="kk-order-title" x-show="selected">
                <template x-if="!sel">
                    <div class="kk-order__loading">
                        <div class="kk-skel kk-skel--line"></div>
                        <div class="kk-skel kk-skel--line short"></div>
                        <div class="kk-skel" style="height:120px; margin-top:12px"></div>
                    </div>
                </template>
                <template x-if="sel && sel.error">
                    <div class="kk-order__loading"><div class="kk-alert" role="alert"><span x-text="sel.error"></span></div></div>
                </template>
                <template x-if="sel && !sel.error">
                    <div>
                        <div class="kk-order__head">
                            <div>
                                <div class="kk-label">Order number</div>
                                <h2 id="kk-order-title" class="kk-order__num" x-text="sel.orderNumber"></h2>
                                <div class="kk-muted" style="font-size:14px" x-text="sel.createdAt ? 'Placed ' + date(sel.createdAt) : ''"></div>
                            </div>
                            <span class="kk-status kk-status--lg" x-bind:class="statusClass(sel.status)"><i aria-hidden="true"></i><span x-text="statusLabel(sel.status)"></span></span>
                        </div>

                        <div class="kk-order__sec">
                            <div class="kk-label">Journey</div>
                            <ol class="kk-journey">
                                <template x-for="(s, i) in steps(sel)" x-bind:key="i">
                                    <li x-bind:class="s.cls">
                                        <div class="kk-journey__row"><span class="kk-journey__mark" x-text="s.mark"></span><span class="kk-journey__line" aria-hidden="true"></span></div>
                                        <div class="kk-journey__text">
                                            <div class="kk-journey__title" x-text="s.label"></div>
                                            <div class="kk-journey__note" x-text="s.note"></div>
                                            <div class="kk-journey__time" x-text="s.time"></div>
                                        </div>
                                    </li>
                                </template>
                            </ol>
                        </div>

                        <div class="kk-parcel">
                            <div class="kk-label">In this parcel</div>
                            <ul>
                                <template x-for="it in sel.books" x-bind:key="it.code">
                                    <li>
                                        <div class="kk-parcel__cover" x-html="cover(it)"></div>
                                        <div class="kk-parcel__body">
                                            <a class="kk-parcel__title" style="text-decoration:none" x-bind:href="'/products/' + it.code" x-text="it.title"></a>
                                            <div class="kk-line__sub" x-text="'N° ' + it.code + ' · ' + it.quantity + ' × ' + fmt(it.price)"></div>
                                        </div>
                                        <div class="kk-price" x-text="fmt(it.price * it.quantity)"></div>
                                    </li>
                                </template>
                            </ul>
                            <div class="kk-parcel__total"><span class="kk-label kk-label--2">Total</span><span x-text="fmt(sel.total)"></span></div>
                        </div>

                        <div class="kk-order__facts">
                            <div><div class="kk-label">Deliver to</div><address x-text="address(sel)"></address></div>
                            <div><div class="kk-label">Contact</div><p x-text="contact(sel)"></p></div>
                            <div><div class="kk-label">Note</div><p x-bind:class="{ 'kk-muted': !sel.comments }" x-text="sel.comments || 'No note left.'"></p></div>
                        </div>

                        <div class="kk-order__foot">
                            <a class="kk-link" href="/products" style="font-size:14px">Order something else</a>
                            <button class="kk-danger-btn" type="button" x-show="features.cancelOrders && sel.status === 'NEW'" x-cloak>Cancel order</button>
                        </div>
                    </div>
                </template>
            </article>
        </div>
    </div>
</div>

<div layout:fragment="pageScripts">
    <script th:inline="javascript">
        /*<![CDATA[*/
        const KK_PAGE = {
            selected: /*[[${selectedOrderNumber}]]*/ null,
            placed: /*[[${placed}]]*/ false,
            userEmail: /*[[${currentUser != null ? currentUser.email : ''}]]*/ ''
        };
        /*]]>*/
    </script>
    <script src="/js/orders.js"></script>
</div>
</body>
</html>
