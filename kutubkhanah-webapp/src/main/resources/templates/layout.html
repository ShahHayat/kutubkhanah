<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title layout:title-pattern="$CONTENT_TITLE — $LAYOUT_TITLE">Kutub Khanah</title>
    <meta name="description" content="Kutub Khanah — a bookshop for people who still love the weight of a good book."/>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230E0C09'/%3E%3Crect x='9' y='9' width='14' height='14' transform='rotate(45 16 16)' fill='%23E4C47F'/%3E%3C/svg%3E"/>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&amp;family=Hanken+Grotesk:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;family=Gulzar&amp;display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="/css/styles.css"/>
    <script type="importmap">{ "imports": { "three": "/webjars/three/0.169.0/build/three.module.js" } }</script>
</head>
<body>

<!-- Header -->
<header class="kk-header" x-data="{ path: location.pathname }">
    <div class="kk-container kk-header__inner">
        <a class="kk-brand" href="/" aria-label="Kutub Khanah, home">
            <span class="kk-brand__urdu" lang="ur">کتب خانہ</span>
            <span class="kk-brand__sep" aria-hidden="true"></span>
            <span class="kk-brand__latin">KUTUB KHANAH</span>
        </a>

        <nav class="kk-nav" aria-label="Primary">
            <a href="/products" x-bind:aria-current="path.startsWith('/products') ? 'page' : null">Catalog</a>
            <a href="/orders" x-bind:aria-current="path.startsWith('/orders') ? 'page' : null">Orders</a>
        </nav>

        <form class="kk-search" role="search" action="/products" method="get">
            <label for="kk-q" class="sr-only">Search books</label>
            <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#958871" stroke-width="1.6" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/></svg>
            <input id="kk-q" name="q" type="search" placeholder="Search by title or code" autocomplete="off"/>
        </form>

        <div class="kk-header__actions">
            <a th:if="${currentUser == null}" class="kk-ghost kk-ghost--sm kk-ghost--quiet" href="/oauth2/authorization/kutubkhanah-webapp">
                <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="12" cy="8.5" r="3.5"/><path d="M5 20c1.2-3.6 4-5.5 7-5.5s5.8 1.9 7 5.5"/></svg>
                Sign in
            </a>
            <th:block th:if="${currentUser != null}">
                <span class="kk-user">
                    <span class="kk-avatar" aria-hidden="true" th:text="${currentUser.initials}">A</span>
                    <span th:text="${currentUser.name}">Name</span>
                </span>
                <a class="kk-ghost kk-ghost--sm kk-ghost--quiet" href="/logout">Sign out</a>
            </th:block>
            <a class="kk-ghost kk-ghost--sm kk-ghost--cart" href="/cart" x-data x-bind:aria-label="'Cart, ' + $store.cart.count + ' items'">
                <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M6 8h12l-1 12H7L6 8z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg>
                Cart
                <span class="kk-cart-badge" x-text="$store.cart.count">0</span>
            </a>
        </div>
    </div>
</header>

<main id="main">
    <div layout:fragment="content"><!-- page content --></div>
</main>

<!-- Footer: slim by default; the home page replaces it with the large one -->
<footer class="kk-footer kk-footer--slim" layout:fragment="footer">
    <div class="kk-container kk-footer__inner">
        <div class="kk-footer__slim-brand"><span class="kk-urdu" lang="ur">کتب خانہ</span>© 2026 Kutub Khanah</div>
        <div>Spring Boot · Catalog · Orders · Notifications</div>
    </div>
</footer>

<!-- Mobile tab bar -->
<nav class="kk-tabbar" aria-label="Primary" x-data="{ path: location.pathname }">
    <a href="/" x-bind:aria-current="path === '/' ? 'page' : null">
        <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M4 11l8-6.5 8 6.5"/><path d="M6 9.5V20h12V9.5"/></svg>
        Home
    </a>
    <a href="/products" x-bind:aria-current="path.startsWith('/products') ? 'page' : null">
        <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M5 4.5h4v15H5z"/><path d="M10.5 4.5h4v15h-4z"/><path d="M16 5.2l3.4-.9 3 14.5-3.4.9z"/></svg>
        Catalog
    </a>
    <a href="/orders" x-bind:aria-current="path.startsWith('/orders') ? 'page' : null">
        <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M4 8l8-4 8 4v8l-8 4-8-4z"/><path d="M4 8l8 4 8-4"/><path d="M12 12v8"/></svg>
        Orders
    </a>
    <a href="/cart" x-bind:aria-current="path.startsWith('/cart') ? 'page' : null" x-bind:aria-label="'Cart, ' + $store.cart.count + ' items'">
        <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M6 8h12l-1 12H7L6 8z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg>
        <span class="kk-cart-badge" aria-hidden="true" x-show="$store.cart.count > 0" x-text="$store.cart.count">0</span>
        Cart
    </a>
</nav>

<div id="kk-toasts" class="kk-toasts" aria-live="polite"></div>

<script src="/js/kk.js"></script>
<div layout:fragment="pageScripts"></div>
<script defer src="/webjars/alpinejs/3.15.12/dist/cdn.min.js"></script>
</body>
</html>
