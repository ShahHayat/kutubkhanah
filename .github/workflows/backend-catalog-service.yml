name: Catalog Service

on:
  push:
    paths:
      - backend-catalog-service/**
      - .github/workflows/backend-catalog-service.yml
    branches:
      - 'master'
  workflow_dispatch:
#  pull_request:
#    branches: [master]

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    env:
      working-directory: ./backend-catalog-service
      DOCKER_IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/bookstore-catalog-service
    defaults:
      run:
        working-directory: ${{ env.working-directory }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'graalvm'
          cache: 'maven'

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Build with Maven
        run: ./mvnw -ntp verify

      - if: ${{ github.ref == 'refs/heads/master' }}
        name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - if: ${{ github.ref == 'refs/heads/master' }}
        name: Build and Publish Docker Image
        run: |
          ./mvnw -ntp spring-boot:build-image -DskipTests -Dspring-boot.build-image.imageName="$DOCKER_IMAGE_NAME"
          echo "Pushing the image $DOCKER_IMAGE_NAME to Docker Hub..."
          docker push "$DOCKER_IMAGE_NAME"